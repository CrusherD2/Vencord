name: Build DevBuild
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
env:
    FORCE_COLOR: true
    plugins_changed: false
permissions:
    contents: write

jobs:
    Build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm build --standalone

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Clean up obsolete files
              run: |
                  rm -rf dist/*-unpacked dist/vendor Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

            - name: Get some values needed for the release
              id: release_values
              run: |
                  echo "release_tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            - name: Upload DevBuild as release
              if: github.repository == 'Vendicated/Vencord'
              run: |
                  gh release upload devbuild --clobber dist/*
                  gh release edit devbuild --title "DevBuild $RELEASE_TAG"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.release_tag }}

            # Forks publish their own release so the installer and updater can pull from them
            - name: Upload DevBuild as release (fork)
              if: github.repository != 'Vendicated/Vencord'
              run: |
                  cat > release-notes.md <<EOF
                  ## Install

                  **Don't download the files below to install.** Get the installer instead:

                  **[Download VencordInstaller.exe](https://github.com/${GITHUB_REPOSITORY_OWNER}/Installer/releases/latest/download/VencordInstaller.exe)** (Windows)

                  Run it, pick your Discord install and click **Install**. Updates arrive automatically through Vencord's updater.

                  ---

                  The files below are the latest build of [${GITHUB_REPOSITORY}](https://github.com/${GITHUB_REPOSITORY}) (${RELEASE_TAG}), which the installer and updater download.
                  EOF
                  # point the tag at this build so the release's Source code downloads match it
                  git tag -f devbuild HEAD
                  git push -f origin refs/tags/devbuild
                  gh release view devbuild > /dev/null 2>&1 || gh release create devbuild --title "DevBuild $RELEASE_TAG" --notes-file release-notes.md
                  gh release upload devbuild --clobber dist/*
                  gh release edit devbuild --title "DevBuild $RELEASE_TAG" --notes-file release-notes.md --latest
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.release_tag }}

            - name: Upload DevBuild to builds repo
              if: github.repository == 'Vendicated/Vencord'
              run: |
                  git config --global user.name "$USERNAME"
                  git config --global user.email actions@github.com

                  git clone https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git upload
                  cd upload

                  GLOBIGNORE=.git:.gitignore:README.md:LICENSE
                  rm -rf *
                  cp -r ../dist/* .

                  git add -A

                  if ! git diff --cached --quiet -- plugins.json plugin-readmes.json; then
                      echo "plugins_changed=true" >> $GITHUB_ENV
                  fi

                  git commit -m "Builds for https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  git push --force https://$USERNAME:$API_TOKEN@github.com/$GH_REPO.git
              env:
                  API_TOKEN: ${{ secrets.BUILDS_TOKEN }}
                  GH_REPO: Vencord/builds
                  USERNAME: GitHub-Actions

            - name: Redeploy vencord.dev if plugin data changed
              if: github.repository == 'Vendicated/Vencord' && env.plugins_changed == 'true'
              run: curl --fail --silent --show-error -X POST "$CLOUDFLARE_DEPLOY_HOOK"
              env:
                  CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
